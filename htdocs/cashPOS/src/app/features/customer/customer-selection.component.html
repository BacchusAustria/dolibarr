<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
    
    <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
      <h2 class="text-xl font-bold text-gray-800">Kunden auswählen</h2>
      <button (click)="close.emit()" class="text-gray-400 hover:text-gray-600 p-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="p-4 border-b">
      <div class="relative">
        <input 
          type="text" 
          [ngModel]="searchTerm()" 
          (ngModelChange)="searchTerm.set($event)"
          placeholder="Name, E-Mail oder Kundennummer suchen..."
          class="w-full pl-10 pr-4 py-3 bg-gray-100 border-none rounded-xl focus:ring-2 focus:ring-[#818872] transition-all"
        >
        <svg class="absolute left-3 top-3.5 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-2">
      @if (filteredCustomers().length > 0) {
        <div class="grid gap-2">
          @for (customer of filteredCustomers(); track customer.id) {
            <div 
              (click)="selectCustomer(customer)"
              [class.selected]="customerService.selectedCustomer()?.id === customer.id"
              class="customer-list-item p-4 rounded-xl border border-gray-100 bg-white shadow-sm flex justify-between items-center"
            >
              <div>
                <div class="font-bold text-gray-800">{{ customer.name }}</div>
                <div class="text-xs text-gray-500">{{ customer.email || 'Keine E-Mail' }}</div>
              </div>
              <div class="text-xs font-mono bg-gray-100 px-2 py-1 rounded text-gray-400">
                {{ customer.code_client }}
              </div>
            </div>
          }
        </div>
      } @else {
        <div class="p-10 text-center text-gray-400">
          Keine Kunden gefunden.
        </div>
      }
    </div>
  </div>
</div>
