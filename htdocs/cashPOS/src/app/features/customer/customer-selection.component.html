<div class="flex-1 flex flex-col bg-white">
  
  <div class="p-4 border-b flex items-center justify-between flex-shrink-0">
    <h2 class="text-lg font-bold">Kunde auswählen</h2>
    <button 
      (click)="close.emit()"
      class="p-2 text-gray-600 hover:text-gray-800"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  
  <div class="p-4 flex-shrink-0">
    <input 
      type="text" 
      placeholder="Kunden suchen (Name, E-Mail)..."
      [(ngModel)]="searchTerm"
      class="w-full border rounded p-2"
    />
  </div>

  <div class="flex-1 overflow-y-auto p-4 space-y-2">
    @if ((customers$ | async)?.length === 0) {
      <p class="text-gray-500 text-center">Keine Kunden gefunden, bitte Suche anpassen.</p>
    }
    
    @for (customer of customers$ | async; track customer.id) {
        <div 
          (click)="selectCustomer(customer)"
          [class]="'customer-list-item p-3 border rounded-lg flex justify-between items-center ' + 
                   ((selectedCustomer$ | async)?.id === customer.id ? 'selected border-[#818872]' : 'bg-white')"
        >
          <div class="font-medium">{{ customer.name }}</div>
         
        </div>
    }
  </div>
</div>
