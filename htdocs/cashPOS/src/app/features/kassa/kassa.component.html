<div class="h-full flex flex-col bg-gray-100 relative">

   <div class="flex flex-col border-b bg-gray-50 shadow-sm z-10" [style.height]="isCartExpanded ? '40vh' : 'auto'"
      style="min-height: 60px; transition: height 0.3s ease-in-out;">
      <div class="px-3 py-2 border-b bg-gray-50 flex items-center justify-between shrink-0" (click)="toggleCart()"
         class="cursor-pointer px-3 py-2 border-b bg-gray-50 flex items-center justify-between shrink-0 hover:bg-gray-100 transition-colors">
         <h2 class="font-medium text-gray-700">Warenkorb ({{ (cartItems$ | async)?.length || 0 }} Artikel)</h2>
         <div class="flex items-center space-x-4 overflow-x-auto">

            <div class="text-xl font-bold text-[#171819]">
               {{ (cartTotal$ | async) | number:'1.2-2' }}€
            </div>

            <svg [class]="'w-5 h-5 transition-transform ' + (isCartExpanded ? 'rotate-180' : 'rotate-0')"
               xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
               stroke-width="2">
               <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
         </div>
         <div class="px-3 py-2 bg-gray-50 flex items-center justify-end shrink-0">
            <button *ngIf="(cartItems$ | async)?.length" (click)="openDiscountModalFromCart({type: 'global'})"
               class="p-1 bg-orange-500 text-white rounded hover:bg-orange-600" title="Gesamtrabatt">
               <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="19" y1="5" x2="5" y2="19"></line>
                  <circle cx="6.5" cy="6.5" r="2.5"></circle>
                  <circle cx="17.5" cy="17.5" r="2.5"></circle>
               </svg>
            </button>

         </div>
      </div>
      <div *ngIf="isCartExpanded" class="flex flex-col" style="max-height: calc(40vh - 60px);">

         <app-cart-list class="flex-1 overflow-x-auto" [items]="cartItems$ | async"
            [subtotal]="(subtotal$ | async) ?? 0" [globalDiscountAmount]="(globalDiscountAmount$ | async) ?? 0"
            [cartTotal]="(cartTotal$ | async) ?? 0" [calculateItemTotal]="calculateItemTotal"
            (removeItem)="removeFromCart($event)" (openDiscountModal)="openDiscountModalFromCart($event)"
            (itemQuantityChange)="updateItemQuantity($event)" (itemLongPress)="openEditModal($event)">
         </app-cart-list>
      </div>

      <div class="flex-1 flex flex-col min-h-0 bg-white relative z-0">

         <app-category-navigation [searchTerm]="searchTerm" [selectedCategory]="selectedCategory"
            [categoryPath]="(categoryPath$ | async) ?? []" [categories]="availableSubCategories$ | async"
            (searchTermChange)="searchTerm = $event" (categorySelect)="navigateToCategory($event)"
            (navigateBack)="navigateBack()"></app-category-navigation>

         <div class="px-3 py-1 bg-white text-xs text-gray-500 border-b">
            {{ (filteredProducts$ | async)?.length }} Produkte gefunden
         </div>

         <app-product-grid class="flex-1 bg-gray-100" [products]="filteredProducts$ | async"
            (productLongPressStart)="handleLongPressStart($event)"
            (productLongPressEnd)="handleLongPressEnd($event)"></app-product-grid>
      </div>

      <app-product-modal
         [product]="productModal" 
         [tempProduct]="tempProduct"
         (tempProductChange)="updateTempProduct($event)"
         (addProduct)="addProductFromModal()"
         (onClose)="closeProductModal()"
         (onDelete)="deleteItemFromModal()"
         [isEditMode]="editingIndex !== null && editingIndex >= 0">
      </app-product-modal>

      <div *ngIf="discountModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
         <div class="bg-white rounded-lg p-6 w-full max-w-sm shadow-xl">
            <h3 class="text-lg font-bold mb-4">
               {{ discountModal.type === 'global' ? 'Gesamtrabatt' : 'Positionsrabatt' }}
            </h3>

            <div class="flex space-x-2 mb-4">
               <button (click)="discountModal.discountType = 'percent'"
                  [class]="'flex-1 py-2 rounded ' + (discountModal.discountType === 'percent' ? 'bg-[#828f9a] text-white' : 'bg-gray-200')">
                  Prozent (%)
               </button>
               <button (click)="discountModal.discountType = 'euro'"
                  [class]="'flex-1 py-2 rounded ' + (discountModal.discountType === 'euro' ? 'bg-[#828f9a] text-white' : 'bg-gray-200')">
                  Euro (€)
               </button>
            </div>

            <input type="number" [(ngModel)]="discountModal.value"
               class="w-full text-2xl text-center border rounded p-3 mb-6" autoFocus>

            <div class="flex space-x-3">
               <button (click)="discountModal = null"
                  class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50">Abbrechen</button>
               <button (click)="applyDiscount()"
                  class="flex-1 px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600">Rabatt
                  setzen</button>
            </div>
         </div>
      </div>

   </div>
