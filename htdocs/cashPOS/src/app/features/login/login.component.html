<div class="flex items-center justify-center h-screen bg-gray-100 p-4">
  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border border-gray-200">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-[#828f9a]">Kassa-Login</h1>
    </div>

    @if (errorMessage) {
      <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
        <strong class="font-bold">Fehler!</strong>
        <span class="block sm:inline ml-2">{{ errorMessage }}</span>
      </div>
    }

    <form (ngSubmit)="login()" class="space-y-6">
            <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Benutzername</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          placeholder="Ihr Benutzername"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-[#828f9a] focus:border-[#828f9a] transition-shadow text-sm"
        >
      </div>
      
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Passwort</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Ihr Passwort"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-[#828f9a] focus:border-[#828f9a] transition-shadow text-sm"
        >
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-[#828f9a] hover:bg-[#171819] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#828f9a] transition-colors disabled:opacity-50"
      >
        @if (isLoading) {
          <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-3"></div>
          Anmelden...
        } @else {
          Anmelden
        }
      </button>
    </form>
  </div>
</div>
