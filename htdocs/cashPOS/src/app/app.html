@if (apiKey) {
<div class="h-screen flex flex-col bg-gray-50 overflow-x-auto">

  <app-header [selectedCustomer]="selectedCustomer$ | async" [cartItemCount]="(cartItems$ | async)?.length || 0"
    [loading]="dataLoading" (onCustomerClick)="currentView = 'customer'" (onPaymentClick)="currentView = 'payment'"
    (logoutStart)="handleLogoutStart()" (logoutEnd)="handleLogoutEnd()" (onHistoryClick)="openHistory()"></app-header>

  <main class="flex-1 flex flex-col min-h-0 relative">

    @if (currentView === 'main') {
    <app-kassa class="flex-1 h-full"></app-kassa>
    }

    @if (currentView === 'customer') {
    <app-customer-selection 
      (customerSelect)="handleSaleCustomer($event)"
      (close)="closeCustomerSelection()"
      class="absolute inset-0 z-20 bg-white"></app-customer-selection>
    }

    @if (currentView === 'history') {
    <app-invoice-history
      (close)="currentView = 'main'" class="absolute inset-0 z-20 bg-white"></app-invoice-history>
    }

    @if (currentView === 'payment') {
    <app-payment [cartTotal]="(cartTotal$ | async) ?? 0" [customer]="selectedCustomer$ | async"
      [paymentAmount]="paymentAmount" [selectedPaymentType]="selectedPaymentType"
      (paymentAmountChange)="updatePaymentAmount($event)" (selectedPaymentTypeChange)="updatePaymentType($event)"
      (completeTransaction)="completeTransaction()" (cancel)="closePaymentSelection()"
      class="absolute inset-0 z-20 bg-white"></app-payment>
    }
  </main>

</div>
}@else {
<app-login></app-login>
}
