@if (apiKey) {
  <div class="h-screen flex flex-col bg-gray-50 overflow-hidden">

    <app-header 
      [selectedCustomer]="customerService.selectedCustomer()" 
      [cartItemCount]="totalItems()" 
      [loading]="dataLoading()"
      (onCustomerClick)="viewService.navigateTo('customer')" 
      (onPaymentClick)="viewService.navigateTo('payment')"
      (onHistoryClick)="viewService.navigateTo('history')"
      (logoutStart)="handleLogoutStart()"
      (logoutEnd)="handleLogoutEnd()"
    ></app-header>

    <main class="flex-1 flex flex-col min-h-0 relative">

      @if (currentView() === 'main') {
        <app-kassa class="flex-1 h-full"></app-kassa>
      }

      @if (currentView() === 'customer') {
        <app-customer-selection 
          (close)="closeCustomerSelection()"
          class="absolute inset-0 z-20 bg-white"
        ></app-customer-selection>
      }

      @if (currentView() === 'history') {
        <app-invoice-history
          (close)="viewService.navigateTo('main')" 
          class="absolute inset-0 z-20 bg-white"
        ></app-invoice-history>
      }

      @if (currentView() === 'payment') {
        <app-payment 
          [cartTotal]="cartService.cartTotal()"
          [customer]="customerService.selectedCustomer()" 
          [paymentAmount]="paymentAmount" 
          [selectedPaymentType]="selectedPaymentType"
          (paymentAmountChange)="updatePaymentAmount($event)" 
          (selectedPaymentTypeChange)="updatePaymentType($event)"
          (completeTransaction)="completeTransaction()" 
          (cancel)="closePaymentSelection()"
          class="absolute inset-0 z-20 bg-white"
        ></app-payment>
      }
      
      @if (dataLoading()) {
        <div class="absolute inset-0 z-50 bg-white/50 flex items-center justify-center">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#828f9a]"></div>
        </div>
      }
    </main>

  </div>
} @else {
  <app-login></app-login>
}
